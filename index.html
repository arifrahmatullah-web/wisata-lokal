<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Wisata Lokal Indonesia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <h1>🌴 Wisata Lokal</h1>
  <nav>
    <a href="#">Beranda</a>
    <a href="#wisata">Wisata</a>
    <a href="login.html">Admin</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h2>Temukan Wisata Favoritmu</h2>
    <p>Wisata alam, kuliner, dan religi lengkap dengan peta & harga tiket</p>
    <a href="#wisata" class="btn">Jelajahi Wisata</a>
  </div>
</section>

<section id="wisata" class="container">
  <h2>Daftar Wisata</h2>

  <!-- SEARCH -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Cari wisata..." onkeyup="cariWisata()">
  </div>

  <!-- FILTER -->
  <div class="filter">
    <button onclick="filterKategori('all')">Semua</button>
    <button onclick="filterKategori('Alam')">🌄 Alam</button>
    <button onclick="filterKategori('Kuliner')">🍜 Kuliner</button>
    <button onclick="filterKategori('Religi')">🕌 Religi</button>
  </div>

  <!-- LIST -->
  <div id="listWisata" class="grid"></div>
</section>

<footer>
  <p>&copy; 2025 Wisata Lokal | Project UAS</p>
</footer>

<script src="script.js"></script>
</body>
</html>
